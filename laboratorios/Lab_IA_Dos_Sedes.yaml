lab:
  title: Lab IA - Dos Sedes
  description: Dos sedes unidas por un enlace WAN, con rutas estaticas. Generado con ayuda de la IA, sin MCP.
  notes: |-
    # Lab IA - Dos Sedes

    | Equipo | Interfaz | Direccion IP | Conecta con |
    |---|---|---|---|
    | R1 | Ethernet0/0 | 10.0.0.1/30 | R2 (WAN) |
    | R1 | Ethernet0/1 | 192.168.10.1/24 | PC1 (Sede 1) |
    | R2 | Ethernet0/0 | 10.0.0.2/30 | R1 (WAN) |
    | R2 | Ethernet0/1 | 192.168.20.1/24 | PC2 (Sede 2) |
    | PC1 | eth0 | 192.168.10.10/24, gateway 192.168.10.1 | R1 |
    | PC2 | eth0 | 192.168.20.10/24, gateway 192.168.20.1 | R2 |

    Rutas estaticas: R1 llega a 192.168.20.0/24 por 10.0.0.2 y R2 llega a 192.168.10.0/24 por 10.0.0.1.

    Verificacion: en R1 "show ip interface brief" y "show ip route"; en PC1 "ping 192.168.20.10".
  version: 0.2.2
nodes:
  - id: n0
    label: R1
    node_definition: iol-xe
    x: -200
    y: 0
    configuration: |-
      hostname R1
      no ip domain lookup
      !
      interface Ethernet0/0
       description WAN hacia R2
       ip address 10.0.0.1 255.255.255.252
       no shutdown
      !
      interface Ethernet0/1
       description LAN Sede 1
       ip address 192.168.10.1 255.255.255.0
       no shutdown
      !
      ip route 192.168.20.0 255.255.255.0 10.0.0.2
      !
      line con 0
       logging synchronous
       exec-timeout 0 0
      !
      end
    tags: [sede1]
    interfaces:
      - id: i0
        label: Loopback0
        slot: 0
        type: loopback
      - id: i1
        label: Ethernet0/0
        slot: 0
        type: physical
      - id: i2
        label: Ethernet0/1
        slot: 1
        type: physical
  - id: n1
    label: R2
    node_definition: iol-xe
    x: 200
    y: 0
    configuration: |-
      hostname R2
      no ip domain lookup
      !
      interface Ethernet0/0
       description WAN hacia R1
       ip address 10.0.0.2 255.255.255.252
       no shutdown
      !
      interface Ethernet0/1
       description LAN Sede 2
       ip address 192.168.20.1 255.255.255.0
       no shutdown
      !
      ip route 192.168.10.0 255.255.255.0 10.0.0.1
      !
      line con 0
       logging synchronous
       exec-timeout 0 0
      !
      end
    tags: [sede2]
    interfaces:
      - id: i0
        label: Loopback0
        slot: 0
        type: loopback
      - id: i1
        label: Ethernet0/0
        slot: 0
        type: physical
      - id: i2
        label: Ethernet0/1
        slot: 1
        type: physical
  - id: n2
    label: PC1
    node_definition: alpine
    x: -200
    y: 200
    configuration: |-
      # Script que Alpine ejecuta al arrancar
      hostname PC1
      ip address add 192.168.10.10/24 dev eth0
      ip link set dev eth0 up
      ip route add default via 192.168.10.1
    tags: [sede1]
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
  - id: n3
    label: PC2
    node_definition: alpine
    x: 200
    y: 200
    configuration: |-
      # Script que Alpine ejecuta al arrancar
      hostname PC2
      ip address add 192.168.20.10/24 dev eth0
      ip link set dev eth0 up
      ip route add default via 192.168.20.1
    tags: [sede2]
    interfaces:
      - id: i0
        label: eth0
        slot: 0
        type: physical
links:
  - id: l0
    n1: n0
    i1: i1
    n2: n1
    i2: i1
    label: R1-Ethernet0/0<->R2-Ethernet0/0
  - id: l1
    n1: n0
    i1: i2
    n2: n2
    i2: i0
    label: R1-Ethernet0/1<->PC1-eth0
  - id: l2
    n1: n1
    i1: i2
    n2: n3
    i2: i0
    label: R2-Ethernet0/1<->PC2-eth0
